# agentgateway, from the image deploy.env pins, with its config bind-mounted read-only.
# See docs/stack.md#agentgateway
services:
  agentgateway:
    image: ${AGW_IMAGE:?}
    container_name: agentgateway
    command: ["-f", "/config/config.yaml"]
    user: ${AGW_USER:?}
    restart: unless-stopped
    ports:
      - "${AGW_ADDR:?}:${AGW_PORT:?}:${AGW_PORT:?}"
      - "127.0.0.1:${AGW_UI_PORT:?}:${AGW_UI_PORT:?}"
      - "127.0.0.1:15020:15020"
    volumes:
      - ./agentgateway:/config:ro
    extra_hosts:
      - "gb10-1:${GB10_1_ADDR:?}"
      - "gb10-2:${GB10_2_ADDR:?}"
      - "framework:${FRAMEWORK_ADDR:?}"
    labels:
      spike.config-section: ${AGW_CONFIG_SECTION:?}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
