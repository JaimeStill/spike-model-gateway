# Probe overlay: one shared bucket of 2 requests every 10 s on the agent route.
# See docs/agentgateway-config.md#rate-limit-agent
#@ replace       - condition: 'apiKey.name == "bulk"'
      - condition: 'true'
        type: requests
        maxTokens: 2
        tokensPerFill: 2
        fillInterval: 10s
      - condition: 'apiKey.name == "bulk"'
