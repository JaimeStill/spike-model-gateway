# The 429 probe on the llm form: a local request-rate limit on the agent alias's port alone, small
# enough that a handful of requests trips it. Its bucket holds 2 requests and gets 2 back every
# 10 s, so the third request within a 10 s window answers 429 with `retry-after` (the seconds to the
# next refill, at least 1) and `x-ratelimit-limit`, `-remaining`, and `-reset`
# (crates/agentgateway/src/proxy/mod.rs, ProxyError's response; http/localratelimit.rs). No `key`,
# so every caller on the port shares the one bucket.
#
# The llm section serves the four alias gateways through one route, which the access log names
# `route=internal/llm:request`, and its own `llm.policies.localRateLimit` takes no condition, so a
# limit there would hold every alias. This top-level policy targets that route and is conditional:
# its one entry applies only when the request arrived on the `agent` gateway, and with no
# unconditioned fallback entry, a request on any other gateway takes no limit. Applied by
# `scripts/agentgateway-deploy.sh rate-limit-agent-llm`, removed by a deploy without it.
#@ append
policies:
- name:
    name: probe-rate-limit-agent-llm
    namespace: default
  target:
    route:
      name: llm:request
      namespace: internal
  policy:
    localRateLimit:
      conditional:
      - condition: proxy.listener.name == "agent"
        maxTokens: 2
        tokensPerFill: 2
        fillInterval: 10s
