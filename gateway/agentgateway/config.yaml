# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway v1.7.0 in front of the four vLLM rows, run on gb10-2 in the gateway's compose
# project (gateway/compose.yml), which mounts the deployed copy's directory read-only at /config;
# scripts/agentgateway-deploy.sh renders the copy and deploys the project.
# agentgateway watches the file and reloads it in place, so a deploy that changes only this file
# needs no restart. Fields under `config` are read once, at start.
#
# The routing form serves the four aliases: one route per alias on the `consumer` gateway, port
# 3000, each with an inline `ai` backend. Each alias's base URL is http://gb10-2:3000/<alias>/v1,
# which the route rewrites to /v1 and sends to its row, or, while the row is evicted, to its Azure
# AI Foundry deployment under the same alias (the routes below); its /v1/models is answered by the
# gateway, listing that alias alone, whether the row is up or not. agentgateway's docs recommend
# this form for path-based
# LLM routing (llm/configuration-modes.md). Task `routing` trialled the `llm` section, one port an
# alias, and it passed, but the gateway stays on the documented form while `llm` converges; the
# trial is in docs/findings/routing.md, and docs/watch.md tracks what would move the gateway to
# `llm`.
#
# A consumer key reaches the serving endpoints only, the eight paths of the allow-list on each
# route (&not-serving): /v1/models, chat/completions, completions, messages, responses,
# embeddings, audio/transcriptions, and audio/translations. Every other path is answered 404 once
# the key is admitted: by the route itself under /<alias>/v1, and as an unrouted path anywhere
# else. vLLM's root routes (/metrics, /health, /tokenize, /docs) are among those refused. A
# missing, unknown, or revoked key gets 401 on every path, before anything else.
config:
  # The admin API and its UI, on the container's own loopback: no published port reaches it.
  adminAddr: localhost:15000
  # This file is the only source of configuration. The UI reads it and can't write it: a save
  # answers 403, so no key or route is ever created outside git.
  storage:
    mode: readOnly
  # The compose project's Postgres (gateway/postgres.yml), reached by its service name on the
  # project's network, where the request log and token budgets will be kept. agentgateway connects
  # at start, and compose starts it only once Postgres is healthy. The password is committed only
  # as the marker `@@secret:postgres-password@@`, which scripts/agentgateway-deploy.sh replaces in
  # the copy it sends with the password it keeps untracked under .state/agentgateway/.
  database:
    url: postgres://agentgateway:@@secret:postgres-password@@@postgres:5432/agentgateway

# Every request's access log line carries two fields of the reply's headers, each empty or absent
# when the reply has none. Log fields only; they change no routing or limit (docs:
# observability/access-logs/view.md).
# - `retry_after`, its Retry-After: the only place a client's 429 or 503 shows it to a reader, since
#   GuideLLM keeps a refused request's status but none of its headers.
# - `overflow`, its overflow marker: "azure" on every reply an Azure deployment answered, set by that
#   provider's response header policy (&overflow-marker, below), which the log reads after it
#   applies. Beside the route, which names the alias and so the deployment, it is what the Azure
#   request count reads (scripts/clients-lib.sh, azure_count). `gen_ai.provider.name`, logged on
#   every LLM request, reads `azure` there too (providerOverride), and `custom` on a row's.
#   `endpoint` names the Azure account's host, so a quoted line has it replaced.
frontendPolicies:
  accessLog:
    add:
      retry_after: 'response.headers["retry-after"]'
      overflow: 'response.headers["x-gateway-overflow"]'

gateways:
  # The consumer port, published on gb10-2's tailnet address (deploy.env). It isn't named
  # `default`: the UI attaches itself to a gateway of that name when `ui.gateways` is unset.
  consumer:
    port: 3000
    # Every request on the port needs a gateway-issued key, sent as a Bearer token, before any route
    # is chosen: a missing, unknown, or revoked key gets 401, on alias routes and unrouted paths
    # alike. The key is removed before the request is forwarded, so no row sees it.
    #
    # Each key is a random 256-bit value kept on the deploying machine, under
    # .state/agentgateway/keys/<name>, untracked. Only the key names are committed: each entry's
    # keyHash is the marker `sha256:@@<name>@@`, and scripts/agentgateway-deploy.sh creates any
    # missing key, then sends gb10-2 a copy of this file with each marker replaced by its key's
    # `sha256:<hex>`; a marker never reaches gb10-2. Adding an entry and deploying issues a key;
    # removing one and deploying revokes it with no restart (docs/findings/agentgateway.md, "Keys").
    apiKey:
      mode: strict
      keys:
      - keyHash: sha256:@@architect@@
        metadata:
          name: architect
      - keyHash: sha256:@@bench@@
        metadata:
          name: bench
      - keyHash: sha256:@@go-ai@@
        metadata:
          name: go-ai
  # The UI, read-only (config.storage), on its own port, published on gb10-2's loopback only and
  # reached through an SSH tunnel. The admin API's debug and shutdown endpoints stay on adminAddr.
  ui:
    port: 3001

ui:
  gateways: ui

# One route per alias. Each matches /<alias>/v1 and below, rewrites that prefix to /v1, and sends
# the request to one `ai` backend of two priority groups: the alias's row first, then its Azure AI
# Foundry deployment. A request goes to the first group with a provider not evicted, so Azure
# answers only while the row is out: nothing fails over between hosts, only from a row to its own
# deployment (docs: the Kubernetes failover page, "Self-hosted primary, cloud fallback"; standalone,
# schema/config.md `routes[].backends[].ai.groups`). `groups` must be the `ai` backend's only key,
# or it parses as one provider (types/local.rs, LocalAIBackend) [src], so the row's host and every
# policy sit on each provider.
#
# The route policies, the same on all four (anchored on agent's):
# - The serving-path allow-list (&not-serving), and /v1/models answered by the gateway.
# - Typed request formats (&typed): Chat Completions, embeddings, Messages, and Responses are parsed
#   as such, so the gateway sets each provider's model in the body and its path (`detect` does
#   neither for a JSON body: llm/mod.rs set_default_path; proxy/httpproxy.rs) [src], and adds
#   `stream_options.include_usage` to every Chat Completions stream, so a stream's usage is read
#   whether or not the client asks (llm/mod.rs) [src]. The keys are path suffixes, matched longest
#   first with "*" last (llm/policy/mod.rs, resolve_route) [src]; the rest stay `detect`.
# - A retry (&retry-503): up to 2 more attempts on a 503 or a failed connection, each after a
#   20 ms backoff (`backoff`, a duration; http/retry/mod.rs) [src]. The provider is chosen again on
#   each attempt (proxy/httpproxy.rs) [src], so a retry reaches Azure once the row is evicted. An
#   eviction reaches the load balancer through a spawned task (types/loadbalancer.rs,
#   finish_request) [src], so a retry sent at once can still find the row; the backoff lets the
#   eviction land, so the refused request itself is carried to Azure. Against a mock row on the
#   laptop, with no backoff the request whose two 503s evicted the row got its third 503 from the
#   row, and with 20 ms it went to Azure on its third attempt; benchmark C is to show it live. A
#   body is buffered for a retry only up to 64 KiB (MAX_BUFFERED_BYTES); a larger one, such as a
#   1440p image, is sent once, unretried [src].
#
# The row's provider (&row-*): a custom provider at the row's host and port over plain HTTP on the
# tailnet, listing the four typed formats, so each passes through unchanged; it keeps the client's
# model, the alias, which each row serves as its only model name. Its health policy (&row-health)
# marks a reply unhealthy on 503, the row's refusal once twice its cap is in flight
# (--max-num-queued-reqs, spike-model-engines host/), or on a failed connection, where there is no
# reply; two in a row evict the row for 5 s, and each later eviction is longer, 5 s times the
# times it has been evicted, with no cap (http/health.rs) [src].
#
# The Azure provider (&azure-*): an OpenAI-compatible custom provider at the spike's Foundry
# account, https://<account>.services.ai.azure.com/openai/v1/<path>, the endpoint each deployment
# was verified on, with the account's key in `api-key` (backendAuth) on this provider alone, so no
# row ever sees it. agentgateway's `azure` provider reaches neither that host and path: its
# `foundry` resource type builds /api/projects/<project>/openai/v1/ (a Foundry project, which the
# account has none of), and `openAI` builds <account>.openai.azure.com (crates/llm/src/azure.rs)
# [src]. A host override drops the provider's default TLS, so `backendTLS: {}` restores it, with
# SNI and Host from the host (proxy/httpproxy.rs, apply_auto_hostname) [src]. The account's name
# and key are committed only as the secret markers azure-account and azure-key, which
# scripts/agentgateway-deploy.sh fills from .state/azure/ in the copy it sends. Each provider
# names its deployment as the model, lists only the formats that deployment serves (a Messages
# request is translated to one of them; llm/mod.rs, CHAT_TRANSLATIONS) [src], and sets
# `providerOverride: azure`, so the access log's `gen_ai.provider.name` reads `azure` on every
# request Azure answers, and `custom` on a row's. Every reply from it carries
# `x-gateway-overflow: azure` (&overflow-marker); a row's reply never does. Its health policy is
# the row's (&row-health): two 503s or failed connections in a row evict it for 5 s, where
# agentgateway's default for an `ai` backend of several groups would evict it on one 5xx or failed
# connection, for 3 s (llm/mod.rs; http/health.rs) [src]; a 429 doesn't evict it. With both groups
# evicted, the load balancer picks an evicted provider rather than none (types/loadbalancer.rs)
# [src], so a request can then reach a row that is still out; on the laptop, a 502 the gateway made
# of a reply it couldn't parse evicted the mock Azure provider, and the next request went to the
# refused row.
routes:
- name: agent
  gateways: consumer
  matches:
  - path:
      pathPrefix: /agent/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    # Read after the rewrite: route policies run in a fixed order, the URL rewrite before the direct
    # response (proxy/httpproxy.rs, apply_request_policies). An exact path match can't do this: a
    # prefix rewrite needs a prefix match (http/filters.rs). The first entry whose condition holds
    # answers:
    # - /v1/models, the alias alone, in OpenAI's list shape, from the gateway itself, whether the
    #   row is up or not, so a client that takes the one listed model (go-ai's tier, infer) gets
    #   the alias during an overflow too;
    # - any path off the serving allow-list, 404. /v1/models/<id> is left out: no client here reads
    #   one model.
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"agent","object":"model","owned_by":"gateway"}]}'
      - &not-serving
        condition: >-
          !(request.path in ["/v1/models", "/v1/chat/completions", "/v1/completions",
          "/v1/messages", "/v1/responses", "/v1/embeddings", "/v1/audio/transcriptions",
          "/v1/audio/translations"])
        status: 404
    ai: &typed
      routes:
        /v1/chat/completions: completions
        /v1/embeddings: embeddings
        /v1/messages: messages
        /v1/responses: responses
        "*": detect
    retry: &retry-503
      attempts: 2
      backoff: 20ms
      codes: [503]
  backends:
  - ai:
      groups:
      - providers:
        - name: agent-row
          hostOverride: gb10-1:8000
          provider:
            custom:
              formats: &row-formats
              - type: completions
              - type: messages
              - type: responses
              - type: embeddings
          policies:
            health: &row-health
              # A failed connection has no reply, so no response.code (proxy/httpproxy.rs,
              # finalize_attempt_for_retry) [src].
              unhealthyExpression: '!has(response.code) || response.code == 503'
              eviction:
                consecutiveFailures: 2
                duration: 5s
      - providers:
        - name: agent-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              # gpt-oss-120b, DataZoneStandard: Chat Completions only; Messages is translated to it.
              model: gpt-oss-120b
              providerOverride: azure
              formats:
              - type: completions
          policies: &azure-policies
            health: *row-health
            backendTLS: {}
            backendAuth:
              key:
                value: '@@secret:azure-key@@'
                location:
                  header:
                    name: api-key
            responseHeaderModifier: &overflow-marker
              set:
                x-gateway-overflow: azure
- name: vision
  gateways: consumer
  matches:
  - path:
      pathPrefix: /vision/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"vision","object":"model","owned_by":"gateway"}]}'
      - *not-serving
    ai: *typed
    retry: *retry-503
  backends:
  - ai:
      groups:
      - providers:
        - name: vision-row
          hostOverride: gb10-2:8000
          provider:
            custom:
              formats: *row-formats
          policies:
            health: *row-health
      - providers:
        - name: vision-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              # gpt-5-mini 2025-08-07, GlobalStandard: Chat Completions and Responses; Messages is
              # translated to Responses, the first translation listed for it.
              model: gpt-5-mini
              providerOverride: azure
              formats:
              - type: completions
              - type: responses
          policies: *azure-policies
- name: audio
  gateways: consumer
  matches:
  - path:
      pathPrefix: /audio/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"audio","object":"model","owned_by":"gateway"}]}'
      - *not-serving
    ai: *typed
    retry: *retry-503
  backends:
  - ai:
      groups:
      - providers:
        - name: audio-row
          hostOverride: framework:8001
          provider:
            custom:
              formats: *row-formats
          policies:
            health: *row-health
      - providers:
        - name: audio-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              # gpt-audio-mini 2025-12-15, GlobalStandard: Chat Completions only, and only with
              # audio in or out; a text-only chat is refused, a parity gap the finding records.
              model: gpt-audio-mini
              providerOverride: azure
              formats:
              - type: completions
          policies: *azure-policies
- name: embedding
  gateways: consumer
  matches:
  - path:
      pathPrefix: /embedding/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"embedding","object":"model","owned_by":"gateway"}]}'
      - *not-serving
    ai: *typed
    retry: *retry-503
  backends:
  - ai:
      groups:
      - providers:
        - name: embedding-row
          hostOverride: framework:8002
          provider:
            custom:
              formats: *row-formats
          policies:
            health: *row-health
      - providers:
        - name: embedding-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              # text-embedding-3-small, DataZoneStandard: embeddings only.
              model: text-embedding-3-small
              providerOverride: azure
              formats:
              - type: embeddings
          policies:
            health: *row-health
            backendTLS: {}
            backendAuth:
              key:
                value: '@@secret:azure-key@@'
                location:
                  header:
                    name: api-key
            responseHeaderModifier: *overflow-marker
            # The row's vectors are 768 long (granite-embedding-english-r2), and
            # text-embedding-3-small's are 1,536 unless asked: every request to Azure is set to 768,
            # whatever the client sent, so an overflow vector is the row's length. Its values are
            # still from another vector space; the overflow marker tells a client that stores
            # vectors to refuse or re-route it.
            ai:
              overrides:
                dimensions: 768
