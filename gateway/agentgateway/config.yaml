# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway's configuration: the four aliases' routes, keys, limits, and overflow to Azure.
# See docs/agentgateway-config.md#the-deployed-copy
# See docs/agentgateway-config.md#the-routing-form
config:
  # See docs/agentgateway-config.md#admin-api-and-ui
  adminAddr: localhost:15000
  storage:
    mode: readOnly
  # See docs/agentgateway-config.md#database
  database:
    url: postgres://agentgateway:@@secret:postgres-password@@@postgres:5432/agentgateway
  # See docs/agentgateway-config.md#tracing
  tracing:
    otlpEndpoint: http://otel-collector:4317
    otlpProtocol: grpc
    randomSampling: "true"

# See docs/agentgateway-config.md#access-log
# See docs/agentgateway-config.md#request-log
frontendPolicies:
  accessLog:
    add:
      retry_after: 'response.headers["retry-after"]'
      overflow: 'response.headers["x-gateway-overflow"]'
      key_name: 'apiKey.name'
    database:
      llm: metadata
      add:
        agentgateway.user: 'apiKey.name'

gateways:
  # See docs/agentgateway-config.md#keys
  consumer:
    port: 3000
    # See docs/agentgateway-config.md#token-budgets
    apiKey:
      mode: strict
      keys:
      - keyHash: sha256:@@architect@@
        metadata:
          name: architect
        budgets: &audit-budget
        - name: tokens
          limit:
            unit: Tokens
            amount: 5000000
          window:
            rolling: 1h
          onBudgetExceeded: Audit
      - keyHash: sha256:@@bench@@
        metadata:
          name: bench
        budgets: *audit-budget
      - keyHash: sha256:@@go-ai@@
        metadata:
          name: go-ai
        budgets: *audit-budget
      - keyHash: sha256:@@bulk@@
        metadata:
          name: bulk
        budgets:
        - name: tokens
          limit:
            unit: Tokens
            amount: 1000000
          window:
            rolling: 1h
          onBudgetExceeded: Block
  ui:
    port: 3001

ui:
  gateways: ui

# See docs/agentgateway-config.md#overflow-groups
routes:
- name: agent
  gateways: consumer
  matches:
  - path:
      pathPrefix: /agent/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    # See docs/agentgateway-config.md#serving-paths
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"agent","object":"model","owned_by":"gateway"}]}'
      - &not-serving
        condition: >-
          !(request.path in ["/v1/models", "/v1/chat/completions", "/v1/completions",
          "/v1/messages", "/v1/responses", "/v1/embeddings", "/v1/audio/transcriptions",
          "/v1/audio/translations"])
        status: 404
    # See docs/agentgateway-config.md#typed-formats
    ai: &typed
      routes:
        /v1/chat/completions: completions
        /v1/embeddings: embeddings
        /v1/messages: messages
        /v1/responses: responses
        "*": detect
    # See docs/agentgateway-config.md#retry
    retry: &retry-503
      attempts: 2
      backoff: 20ms
      codes: [503]
    # See docs/agentgateway-config.md#request-rate-buckets
    localRateLimit: &key-rates
      conditional:
      - condition: 'apiKey.name == "bulk"'
        key: apiKey.name
        type: requests
        maxTokens: 600
        tokensPerFill: 600
        fillInterval: 60s
      - key: apiKey.name
        type: requests
        maxTokens: 1200
        tokensPerFill: 1200
        fillInterval: 60s
  backends:
  - ai:
      groups:
      - providers:
        - name: agent-row
          hostOverride: gb10-1:8000
          provider:
            custom:
              formats: &row-formats
              - type: completions
              - type: messages
              - type: responses
              - type: embeddings
          policies:
            health: &row-health
              # See docs/agentgateway-config.md#row-provider
              unhealthyExpression: '!has(response.code) || response.code == 503'
              eviction:
                consecutiveFailures: 2
                duration: 5s
            # See docs/agentgateway-config.md#priority-by-key
            ai: &row-priority
              transformations:
                priority: 'apiKey.name == "bulk" ? 10 : 0'
      - providers:
        - name: agent-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              # See docs/agentgateway-config.md#azure-deployments
              model: gpt-oss-120b
              providerOverride: azure
              formats:
              - type: completions
          policies: &azure-policies
            health: &azure-health
              # See docs/agentgateway-config.md#azure-provider
              unhealthyExpression: '!has(response.code) || response.code == 503 || response.code == 429'
              eviction:
                consecutiveFailures: 2
                duration: 5s
            backendTLS: {}
            backendAuth:
              key:
                value: '@@secret:azure-key@@'
                location:
                  header:
                    name: api-key
            responseHeaderModifier: &overflow-marker
              set:
                x-gateway-overflow: azure
- name: vision
  gateways: consumer
  matches:
  - path:
      pathPrefix: /vision/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"vision","object":"model","owned_by":"gateway"}]}'
      - *not-serving
    ai: *typed
    retry: *retry-503
    localRateLimit: *key-rates
  backends:
  - ai:
      groups:
      - providers:
        - name: vision-row
          hostOverride: gb10-2:8000
          provider:
            custom:
              formats: *row-formats
          policies:
            health: *row-health
            ai: *row-priority
      - providers:
        - name: vision-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              model: gpt-5-mini
              providerOverride: azure
              formats:
              - type: completions
              - type: responses
          policies: *azure-policies
- name: audio
  gateways: consumer
  matches:
  - path:
      pathPrefix: /audio/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"audio","object":"model","owned_by":"gateway"}]}'
      - *not-serving
    ai: *typed
    retry: *retry-503
    localRateLimit: *key-rates
  backends:
  - ai:
      groups:
      - providers:
        - name: audio-row
          hostOverride: framework:8001
          provider:
            custom:
              formats: *row-formats
          policies:
            health: *row-health
      - providers:
        - name: audio-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              model: gpt-audio-mini
              providerOverride: azure
              formats:
              - type: completions
          policies: *azure-policies
- name: embedding
  gateways: consumer
  matches:
  - path:
      pathPrefix: /embedding/v1
  policies:
    urlRewrite:
      path:
        prefix: /v1
    directResponse:
      conditional:
      - condition: request.path == "/v1/models"
        status: 200
        headers:
          content-type: '"application/json"'
        body: '{"object":"list","data":[{"id":"embedding","object":"model","owned_by":"gateway"}]}'
      - *not-serving
    ai: *typed
    retry: *retry-503
    # See docs/agentgateway-config.md#embedding-limits
    localRateLimit:
    - type: requests
      maxTokens: 34
      tokensPerFill: 34
      fillInterval: 1s
    - key: apiKey.name
      type: requests
      maxTokens: 68
      tokensPerFill: 68
      fillInterval: 1s
  backends:
  - ai:
      groups:
      - providers:
        - name: embedding-row
          hostOverride: framework:8002
          provider:
            custom:
              formats: *row-formats
          policies:
            health: *row-health
      - providers:
        - name: embedding-azure
          hostOverride: '@@secret:azure-account@@.services.ai.azure.com:443'
          pathPrefix: /openai/v1
          provider:
            custom:
              model: text-embedding-3-small
              providerOverride: azure
              formats:
              - type: embeddings
          policies:
            health: *azure-health
            backendTLS: {}
            backendAuth:
              key:
                value: '@@secret:azure-key@@'
                location:
                  header:
                    name: api-key
            responseHeaderModifier: *overflow-marker
            # See docs/agentgateway-config.md#embedding-dimensions
            ai:
              overrides:
                dimensions: 768
