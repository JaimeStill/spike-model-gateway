# Tempo, the trace store, fed by the Collector and read by Grafana.
# See docs/stack.md#tempo
# See docs/stack.md#unattested-builds
services:
  tempo:
    build:
      context: tempo
      provenance: false
      sbom: false
    restart: unless-stopped
    volumes:
      - gateway-tempo:/var/tempo

volumes:
  gateway-tempo:
