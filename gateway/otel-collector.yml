# The OpenTelemetry Collector, the stack's one OTLP ingress, forwarding every span to Tempo.
# See docs/stack.md#the-collector
# See docs/stack.md#unattested-builds
services:
  otel-collector:
    build:
      context: otel-collector
      provenance: false
      sbom: false
    restart: unless-stopped
    ports:
      - "${AGW_ADDR:?}:${OTEL_GRPC_PORT:?}:4317"
    depends_on:
      tempo:
        condition: service_started
