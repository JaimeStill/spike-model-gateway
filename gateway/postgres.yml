# Postgres, agentgateway's database (config.database in agentgateway/config.yaml): its request log
# and token budgets live here. It publishes no port: only agentgateway reaches it, as `postgres` on
# the project's network. Its password is generated by the deploy on the laptop, kept untracked
# under .state/agentgateway/, and reaches gb10-2 only in postgres.env, beside the deployed compose
# files, 0600; the image reads it on the first start, when it initializes the volume.
services:
  postgres:
    build:
      context: postgres
    env_file: postgres.env
    restart: unless-stopped
    volumes:
      - gateway-postgres:/var/lib/postgresql

volumes:
  gateway-postgres:
