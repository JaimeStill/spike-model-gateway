# Postgres, agentgateway's database (config.database in agentgateway/config.yaml): its request log
# and token budgets live here. It publishes no port: only agentgateway reaches it, as `postgres` on
# the project's network. Its password is generated by the deploy on the laptop, kept untracked
# under .state/agentgateway/, and reaches gb10-2 only in postgres.env, beside the deployed compose
# files, 0600; the image reads it on the first start, when it initializes the volume.
services:
  postgres:
    # The deploy runs `up --build`, and compose creates the container again whenever the built
    # image's id changes. BuildKit attaches a provenance attestation by default, which records the
    # build's own times, and with gb10-2's containerd image store the image id is the digest of the
    # index that lists the attestation, so every build made a new id from an unchanged Dockerfile,
    # and every deploy recreated Postgres. Compose v5.2.0 drops `provenance: false` and `sbom: false`
    # from the bake definition it writes (`compose.sh build --print postgres` shows no `attest`), so
    # compose.sh also sets BUILDX_NO_DEFAULT_ATTESTATIONS; a later Compose honours the two below.
    # With no attestation, a cached build of an unchanged Dockerfile is the same image, and `up`
    # leaves the container alone; a changed Dockerfile still rebuilds it.
    build:
      context: postgres
      provenance: false
      sbom: false
    env_file: postgres.env
    restart: unless-stopped
    volumes:
      - gateway-postgres:/var/lib/postgresql

volumes:
  gateway-postgres:
