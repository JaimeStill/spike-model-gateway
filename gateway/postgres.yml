# Postgres, agentgateway's database for its request log and token budgets.
# See docs/stack.md#postgres
# See docs/stack.md#unattested-builds
services:
  postgres:
    build:
      context: postgres
      provenance: false
      sbom: false
    env_file: postgres.env
    restart: unless-stopped
    volumes:
      - gateway-postgres:/var/lib/postgresql

volumes:
  gateway-postgres:
