# Grafana, with Tempo as its datasource, for searching the stack's traces.
# See docs/stack.md#grafana
# See docs/stack.md#unattested-builds
services:
  grafana:
    build:
      context: grafana
      provenance: false
      sbom: false
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:?}:3000"
    volumes:
      - gateway-grafana:/var/lib/grafana
    depends_on:
      tempo:
        condition: service_started

volumes:
  gateway-grafana:
