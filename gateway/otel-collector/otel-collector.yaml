# The gateway's OpenTelemetry Collector (gateway/otel-collector.yml): one pipeline, traces. It
# receives OTLP over gRPC from agentgateway, on the compose network, and from the four vLLM rows,
# through the port published on gb10-2's tailnet address; batches the spans; and exports them to
# Tempo by its service name. No metrics or logs pipeline: the answer task traces only.

extensions:
  # Liveness on 13133, published nowhere (gateway/otel-collector.yml). The image has no shell to
  # probe it from, so compose runs no health check; a request from another container on the
  # compose network reads it when needed.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  # OTLP over gRPC only, which agentgateway's config.tracing and vLLM's --otlp-traces-endpoint
  # both send. It binds every interface, since the default, localhost, is unreachable through the
  # published port and from the compose network.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  # Tempo's OTLP gRPC receiver, plaintext inside the compose network.
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
