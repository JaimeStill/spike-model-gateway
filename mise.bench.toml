# The bench environment: GuideLLM and its runtimes, activated with MISE_ENV=bench.
# See docs/stack.md#the-tools
[tools]
# Held on 3.14: the recorded benchmarks ran on it, and torchcodec 0.17.0, which GuideLLM
# 0.8.1's audio extra needs, publishes no Python 3.15 (cp315) wheel or sdist yet.
python = "3.14.10"
uv = "0.13.9"
"pipx:guidellm" = { version = "0.8.1", extras = ["vision", "audio"] }
