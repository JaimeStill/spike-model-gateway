# Benchmark A's embedding run: 160 in flight, held to 34 a second by the route's limit.
# See docs/bench.md#limited-embed
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [160]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 90
