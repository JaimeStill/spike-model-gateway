# Benchmark D's bulk run: the vision row at 20 concurrent with the bulk key for 120 s.
# See docs/bench.md#bulk-vision-120
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [20]
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 1440p
      format: jpeg
      output_tokens: 100
  constraints:
    - kind: max_duration
      seconds: 120
