# C-agent, the agentgateway task's agent cap cell (behavior 8): the agent row, gpt-oss-120b with FP8
# KV (agent on gb10-1's 8000), through the gateway only, at two levels past the agent's target of
# 4 sessions: 12, then 16, each for 110 s. Observational: nothing stands at the cap on the gateway,
# so the cell shows what a client sees there, every reply's status, the row's running and waiting
# counts, and how latency grows from one level to the next. Derived from overhead-agent.yaml, its
# requests unchanged: GuideLLM's multi-turn synthetic conversation, 4 turns, the first 8,192 prompt
# tokens and the next three 512 each, every turn exactly 512 output tokens, each turn sent when the
# last one's reply ends. Adapted: the two levels, where the overhead cell ran one, 4. The model is
# the alias, agent, given on the command line with its tokenizer (openai/gpt-oss-120b) by `cell`,
# which sets the target, the gateway's base URL, in GUIDELLM__SPEC__BACKEND__TARGET, the bench key
# in GUIDELLM__SPEC__BACKEND__API_KEY, and the run's own seed. Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # GuideLLM checks the backend before a run with GET <target>/health, the target's /v1 cut off.
    # Through the gateway that is /agent/health, which no route serves (404), so the check reads
    # /v1/models instead, which also proves the key before any load is sent.
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [12, 16]
  data:
    - kind: synthetic_text
      turns: 4
      first_prompt_tokens: 8192
      prompt_tokens: 512
      output_tokens: 512
  # Each level stops at 110 s; the sessions in flight then are counted incomplete.
  constraints:
    - kind: max_duration
      seconds: 110
