# C-agent: the agent row through the gateway at 12, then 16 sessions.
# See docs/bench.md#cap-agent
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [12, 16]
  data:
    - kind: synthetic_text
      turns: 4
      first_prompt_tokens: 8192
      prompt_tokens: 512
      output_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 110
