# Benchmark C's vision cell, dropped and never run: the vision row past its queue limit.
# See docs/bench.md#overflow-vision
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [36]
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 720p
      format: jpeg
      output_tokens: 100
  constraints:
    - kind: max_duration
      seconds: 60
