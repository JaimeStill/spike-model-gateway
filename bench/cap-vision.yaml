# C-vision: the vision row through the gateway at 16, then 20 concurrent.
# See docs/bench.md#cap-vision
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [16, 20]
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 1440p
      format: jpeg
      output_tokens: 100
  constraints:
    - kind: max_duration
      seconds: 60
