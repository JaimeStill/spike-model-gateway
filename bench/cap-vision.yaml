# C-vision, the agentgateway task's vision cap cell (behavior 8): the vision row, NVFP4 26B-A4B
# (vision on gb10-2's 8000), through the gateway only, at two levels past the vision target of 4
# concurrent streams: 16, then 20, each for 60 s. Observational: nothing stands at the cap on the
# gateway, so the cell shows what a client sees there, every reply's status, the row's running and
# waiting counts, and how latency grows from one level to the next. Derived from
# overhead-vision.yaml, its requests unchanged: one synthetic 1440p JPEG beside 200 synthetic text
# tokens, exactly 100 output tokens. Adapted: the two levels and 60 s a level, where the overhead
# cell ran one level, 4, for 90 s. The model is the alias, vision, given on the command line with
# its tokenizer (google/gemma-4-26B-A4B-it) by `cell`, which sets the target, the gateway's base
# URL, in GUIDELLM__SPEC__BACKEND__TARGET, the bench key in GUIDELLM__SPEC__BACKEND__API_KEY, and
# the run's own seed. It needs GuideLLM's vision extra, which mise.bench.toml installs. Run from
# the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # GuideLLM checks the backend before a run with GET <target>/health, the target's /v1 cut off.
    # Through the gateway that is /vision/health, which no route serves (404), so the check reads
    # /v1/models instead, which also proves the key before any load is sent.
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [16, 20]
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 1440p
      format: jpeg
      output_tokens: 100
  # Each level stops at 60 s; the requests in flight then are counted incomplete.
  constraints:
    - kind: max_duration
      seconds: 60
