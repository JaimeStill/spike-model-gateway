# Benchmark D's interactive run: the vision row at 1 concurrent with the go-ai key.
# See docs/bench.md#interactive-vision
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [1]
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 1440p
      format: jpeg
      output_tokens: 100
  constraints:
    - kind: max_duration
      seconds: 90
