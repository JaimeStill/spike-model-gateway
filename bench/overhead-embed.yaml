# O-embed: the embedding row at a constant 34 requests a second, direct and through the gateway.
# See docs/bench.md#overhead-embed
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: constant
    rate: [34]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 60
