# C-embed: the embedding row through the gateway at 128, then 160 in flight.
# See docs/bench.md#cap-embed
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [128, 160]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 60
