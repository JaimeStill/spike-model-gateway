# O-agent: the agent row at its target of 4 sessions, direct and through the gateway.
# See docs/bench.md#overhead-agent
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [4]
  data:
    - kind: synthetic_text
      turns: 4
      first_prompt_tokens: 8192
      prompt_tokens: 512
      output_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 110
