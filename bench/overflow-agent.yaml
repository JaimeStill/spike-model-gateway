# Benchmark C's agent cell: the agent row past its queue limit, overflowing to Azure.
# See docs/bench.md#overflow-agent
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [28]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 128
  constraints:
    - kind: max_duration
      seconds: 60
