# C-agent, benchmark C's agent cell (the priority task's behavior 9; evidence 7): the agent row,
# gpt-oss-120b with FP8 KV (agent on gb10-1's 8000), through the gateway only, at 28 sessions for
# 60 s: past the 24 the row holds before it refuses (twice its cap of 12 in flight,
# --max-num-queued-reqs), so the row answers 503, two in a row evict it for 5 s, and the gateway
# sends the agent alias to its Azure AI Foundry deployment, gpt-oss-120b, while it is out. The cell
# reads 503s from the row, the requests Azure answered, whether a refused request reached Azure,
# and the eviction windows a minute (overflow_read, scripts/measure-lib.sh). Every request Azure
# answers counts against the task's cap of 300 (azure_count, scripts/clients-lib.sh). Derived from
# cap-agent.yaml, its requests unchanged: GuideLLM's multi-turn synthetic conversation, 4 turns, the
# first 8,192 prompt tokens and the next three 512 each, every turn exactly 512 output tokens, each
# turn sent when the last one's reply ends. Adapted: one level, 28, for 60 s, where the cap cell
# ran 12 and 16 for 110 s each. The model is the alias, agent, given on the command line with its
# tokenizer (openai/gpt-oss-120b) by `cell`, which sets the target, the gateway's base URL, in
# GUIDELLM__SPEC__BACKEND__TARGET, the bench key in GUIDELLM__SPEC__BACKEND__API_KEY, and the run's
# own seed. Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # GuideLLM checks the backend before a run with GET <target>/health, the target's /v1 cut off.
    # Through the gateway that is /agent/health, which no route serves (404), so the check reads
    # /v1/models instead, which the gateway answers itself and which also proves the key before any
    # load is sent.
    api_routes:
      /health: v1/models
  profile:
    kind: concurrent
    streams: [28]
  data:
    - kind: synthetic_text
      turns: 4
      first_prompt_tokens: 8192
      prompt_tokens: 512
      output_tokens: 512
  # The level stops at 60 s; the sessions in flight then are counted incomplete.
  constraints:
    - kind: max_duration
      seconds: 60
