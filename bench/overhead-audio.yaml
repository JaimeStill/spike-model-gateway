# O-audio: the audio row at 4 concurrent, direct and through the gateway.
# See docs/bench.md#overhead-audio
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#the-backend-check
    api_routes:
      /health: v1/models
    max_tokens: 256
  profile:
    kind: concurrent
    streams: [4]
  # See docs/bench.md#audio-requests
  data:
    - kind: in_memory_dict
      data:
        prompt:
          - &prompt "Transcribe the following speech segment in English into English text. Only output the transcription, with no newlines."
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
          - *prompt
    - kind: huggingface
      source: hf-internal-testing/librispeech_asr_dummy
      load_kwargs:
        name: clean
        split: validation
  data_column_mapper:
    kind: generative_column_mapper
    column_mappings:
      text_column: 0.prompt
      audio_column: 1.audio
  data_preprocessors:
    - kind: encode_media
      audio_kwargs:
        audio_format: wav
        encode_sample_rate: 16000
  constraints:
    - kind: max_duration
      seconds: 30
    - kind: max_requests
      count: 64
